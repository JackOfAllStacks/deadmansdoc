record:
  # ── Section 1 ──────────────────────────────────────────────────────
  - field: s1.first_calls
    entity: Priya
    action: Ring her before anyone else — she has the list
  - field: s1.first_calls
    entity: Tom
    action: Ring him the same day; he needs a day to get here
  - field: s1.fallback_contact
    entity: Priya
  - field: s1.routing_map
    entity: Helen Brandt
    action: Anything legal goes to her
  - field: s1.immediate_actions
    value:
      - Ring Priya, then Tom
      - Ring Helen Brandt before signing anything
      - Leave the Bendigo account alone
    action: In that order
  - field: s1.do_not_yet
    value:
      - Do not close the Bendigo account — the rates come out of it
      - Do not cancel the home insurance
      - Do not empty the house

  # ── Section 2 ──────────────────────────────────────────────────────
  - field: s2.first_72h
    value:
      - Ring Priya and Tom
      - Ring the funeral director
      - Ring Helen Brandt
  - field: s2.first_30d
    value:
      - Get the death certificate
      - Tell Centrelink the pension stops
      - Tell the bank, but do not close anything
  - field: s2.first_6m
    value:
      - Open the safe deposit box with Helen there
      - Decide about the house, not before
  - field: s2.deadlines
    value: Centrelink wants to be told within fourteen days.
  - field: s2.impossible_after_notice
    value:
      - Once the bank is told, the account freezes and the rates stop being paid
  - field: s2.first_week_losses
    value: [The garden, if nobody waters it]
  - field: s2.urgent_decisions
    value: Whether to keep the house through winter. Priya decides.
  - field: s2.time_constrained_rites
    unknown: Priya

  # ── Section 3 ──────────────────────────────────────────────────────
  - field: s3.household
    entity: Priya
  - field: s3.key_people
    entity: Priya
    action: She holds everything — start here
  - field: s3.key_people
    entity: Tom
  - field: s3.responsibilities
    value: [Priya, Tom]
    action: Priya organises, Tom helps with the house
  - field: s3.interrelationships
    value: Priya and Tom get on. Tom has never met Helen Brandt.
  - field: s3.advisers
    entity: Helen Brandt
  - field: s3.financial_knower
    value: [Priya]
  - field: s3.expectations_communicated
    value: [Priya]
    action: Tom has not been told he is an executor
    confidence: uncertain
  - field: s3.do_not_contact
    unknown: Priya
  - field: s3.wrong_call
    value: [Tom]
    action: He would ring the bank first, and that freezes the account
  - field: s3.anticipated_disagreement
    value: The house. Tom wants it sold, Priya does not.

  # ── Section 5 ──────────────────────────────────────────────────────
  - field: s5.accounts
    entity: Everyday account
  - field: s5.accounts
    entity: Safe deposit box
    action: Helen Brandt has to be there to open it
  - field: s5.balances
    entity: Everyday account
    amount: about $18,000
  - field: s5.bill_account
