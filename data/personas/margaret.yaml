  - field: s5.contact_before_change
    value: [Helen Brandt]
  - field: s5.financial_docs_location
    value: The green folder in the hall cupboard, second shelf.
  - field: s5.undisclosed_arrangements
    value: Money lent to Tom in 2019, never asked for back.
  - field: s5.regular_bills
    entity: Council rates
  - field: s5.regular_bills
    entity: Home insurance
  - field: s5.auto_vs_manual
    entity: Council rates
    action: Paid by hand — it will be missed
  - field: s5.uninterruptible_payments
    value: [Home insurance — the house is empty most of the week]
  - field: s5.silent_failures
    value: [The rates. Nobody is told; it just accrues interest]
  - field: s5.annual_surprises
    value: [Home insurance renews in March]
  - field: s5.do_not_close_accounts
    value: [The Bendigo everyday account]
  - field: s5.burn_on_death
