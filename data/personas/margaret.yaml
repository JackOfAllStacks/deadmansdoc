# A finished record: every sitting done, a Guide with something in every
# section, and a sealed envelope that prints.
#
# Invented, like every persona here. No real person, number or place.

key: margaret
name: Margaret — finished
summary: >
  82, doing this with her daughter Priya. Widowed, two children, a safe
  deposit box nobody has opened. Every sitting done, so the Guide is as
  complete as this version gets.

subject_name: Margaret
relationship: parent
present: [Margaret, Priya]

intake_done: true
intake:
  subject_relationship: parent
  family_count: 3
  household_count: 1
  adviser_count: 2
  account_band: "2-4"
  runs_household_money_alone: true
  has_business_or_trust: false
  has_debts_or_guarantees: false
  has_income_after_death: true
  has_time_constrained_rites: false
  has_matters_in_progress: true
  front_of_mind: [people, money-out]

sittings:
  - { key: people, status: done }
  - { key: money-out, status: done }
  - { key: first-days, status: done }
  - { key: money-in-owed, status: done }

entities:
  - type: person
    label: Priya
    data:
      relationship: daughter
      contact: "0400 000 111"
      role: the one who organises everything
  - type: person
    label: Tom
    data:
      relationship: son
      contact: "0400 000 222"
      role: lives interstate, needs a day to travel
  - type: person
    label: Helen Brandt
    data:
      relationship: solicitor
      contact: "03 9000 0000"
  - type: account
    label: Everyday account
    data:
      institution: Bendigo
      held: sole
  - type: account
    label: Safe deposit box
    data:
      institution: Bendigo, Camberwell branch
  - type: bill
