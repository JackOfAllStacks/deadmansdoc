notes:
  - label: The biscuit tin
    value: It is where the cash is, and it looks like rubbish. Do not throw it out.
    action: Tell Priya before the house is cleared
  - label: The neighbour
    value: Jean at number 14 has a key and waters the garden.

transcript:
  - sitting: people
    from: agent
    text: >
      This sitting is about who your family should call first, who does what,
      and who to keep out of it. We can stop whenever you like.
  - sitting: people
    from: subject
    text: >
      Priya first, always. She's the one who organises everything. Tom's in
      Brisbane so he needs a day's notice to get down here.
  - sitting: people
    from: agent
    text: Thank you. And if Priya couldn't be reached — who then?
  - sitting: people
    from: helper
    text: >
      That'd still be me, realistically. Mum, you'd want them to ring Helen
      before anyone signs anything.
  - sitting: money-out
    from: agent
    text: Now the money going out. What actually pays the bills?
  - sitting: money-out
    from: subject
    text: >
      Everything comes out of the Bendigo account. The rates I pay by hand,
      which I know is silly, but I've always done it that way.
