# Half way through: one sitting done, one open and left part-way, two still
# ahead. What a demo should normally show -- a record being made, not a
# finished one.
#
# Invented. No real person, number or place.

key: john
name: John — half way
summary: >
  A father doing this with his son Jack. One sitting done, the next left
  part-way through, so the plan, the live document and the Guide all have
  something real in them without being finished.

subject_name: John
relationship: parent
present: [John, Jack]

intake_done: true
intake:
  subject_relationship: parent
  family_count: 4
  household_count: 2
  adviser_count: 1
  account_band: "5+"
  runs_household_money_alone: true
  has_business_or_trust: false
  has_debts_or_guarantees: true
  has_income_after_death: false
  has_time_constrained_rites: false
  has_matters_in_progress: false
  front_of_mind: [people]

sittings:
  - { key: people, status: done }
  - { key: money-out, status: in_progress }
  - { key: first-days, status: planned }
  - { key: money-in-owed, status: planned }

entities:
  - type: person
    label: Robyn
    data:
      relationship: wife
      contact: "0400 111 222"
  - type: person
    label: Jack
    data:
      relationship: son
      contact: "0400 333 444"
      role: doing this with him
  - type: person
    label: Pete
    data:
      relationship: brother
  - type: account
    label: Everyday account
    data:
      institution: a credit union
      held: joint with Robyn
  - type: bill
    label: Electricity
    data:
      provider: a retailer
      paid: monthly, direct debit

record:
  - field: s1.first_calls
    entity: Robyn
    action: She should hear it first, from Jack, not over the phone if it can be helped
  - field: s1.first_calls
    entity: Jack
  - field: s1.fallback_contact
    entity: Jack
  - field: s1.routing_map
    entity: Jack
    action: Anything to do with money goes to him
  - field: s3.household
    entity: Robyn
  - field: s3.key_people
    entity: Robyn
    action: Call her before anyone else
  - field: s3.key_people
    entity: Jack
  - field: s3.key_people
    entity: Pete
    action: Do not ring him in the first week
  - field: s3.responsibilities
    value: [Jack]
    action: Jack handles the paperwork; Robyn should not have to
  - field: s3.interrelationships
    value: Robyn and Pete have not spoken since 2019.
  - field: s3.financial_knower
    value: [John]
    confidence: uncertain
  - field: s3.do_not_contact
    value: [Pete]
    action: Not in the first week. After that, Jack decides
  - field: s3.wrong_call
    value: [Pete]
  - field: s3.anticipated_disagreement
    value: Pete will say he was owed money. Jack has the only record of it.
  - field: s3.advisers
    unknown: Robyn
  - field: s3.expectations_communicated
    unknown: Jack
  # The sitting that is still open, so the live document has a start on it.
  - field: s5.accounts
    entity: Everyday account
  - field: s5.bill_account
    value: The joint account at the credit union. Everything comes out of it.
  - field: s5.regular_bills
    entity: Electricity
  - field: s5.balances
    entity: Everyday account
    amount: about $6,000
  # The two states a gap can be in, so a demo shows both: one with somebody
  # to ask who isn't in the key people list, and one with nobody at all.
  - field: s5.undisclosed_arrangements
    unknown: the accountant at Fenwick & Co
  - field: s5.financial_docs_location
    unknown: true
    priority: high

notes:
  - label: The password book
    value: A small red notebook in the top drawer of the desk. Not a safe place, but it is where it is.
    action: Tell Robyn it exists

transcript:
  - sitting: people
    from: agent
    text: >
      This sitting is about who your family should call first, who does what,
      and who to keep out of it. We can stop whenever you like.
  - sitting: people
    from: subject
    text: >
      Robyn first. She's my wife. But honestly I'd want Jack to tell her, not
      a phone call out of nowhere.
  - sitting: people
    from: agent
    text: >
      That's worth writing down — who tells her matters as much as who is
      called. Is there anyone who shouldn't be rung straight away?
  - sitting: people
    from: subject
    text: >
      My brother Pete. Not in the first week. He and Robyn haven't spoken
      since 2019 and it would just make everything harder.
  - sitting: money-out
    from: agent
    text: >
      This one is about money going out — the accounts, the bills they pay,
      and what has to keep running. About twenty minutes.
  - sitting: money-out
    from: subject
    text: Everything comes out of the joint account at the credit union.

# What they say, if you want to watch it happen rather than seed it.
#
# scripts/demo-run.mjs plays these into the real endpoints at a watchable
# pace, so a demo can show the conversation running and the document filling
# in as somebody talks -- which a seeded record cannot. It costs API credit,
# which is why it stays a deliberate choice rather than the only way to show
# the product.
#
# scripts/e2e-sitting.mjs reads the same lines, so what is tested and what is
# demonstrated can't drift apart. Deliberately rambly, and full of the shapes
# the tools have to cope with: people, a list, an ordered sequence, an "I don't
# know", and a figure that has to end up sealed.
script:
  intake:
    - who: Jack
      says: >-
        There's Dad, my brother Michael in Brisbane and me. Mum died two years ago. Dad's
        also got his brother Terry and his sister Robyn. Honestly the thing he's worried
        about is what's owed on the units and the rent that keeps coming in after he's gone.
    - who: John
      says: >-
        Everyday account and savings with NAB, two term deposits, the share portfolio
        through CommSec, and the company account with Westpac. I've done all of it myself
        since Denise passed.
    - who: John
      says: >-
        There's the building company, still ticking over, and the family trust that owns two
        units in Frankston. No mortgage on the house. There's a loan on the ute and an
        overdraft on the company, and I lent my nephew Trent forty grand on a handshake.
    - who: Jack
      says: >-
        Dad's got an accountant, Peter, a solicitor called Gail who did the will, and a
        bloke who looks after his super.
    - who: John
      says: >-
        The rent from the units would keep coming in, and a couple of final invoices the
        builders still owe me.
    - who: John
      says: >-
        We're not religious. I'd like the RSL to do a short service, and cremation's fine.
        There's no rush.
    - who: Jack
      says: >-
        One of the units is on the market right now, and there's an insurance claim for the
        roof dragging on since March.
    - who: Jack
      says: >-
        I think that covers it.
    - who: Jack
      says: >-
        Yes, that's everything for today, thanks.
  sittings:
    people:
      - who: Jack
        says: >-
          The first person to call would be me. Then Michael in Brisbane, though he'd take a
          day to get here. And Dad's sister Robyn — she's the one who'd actually organise
          people.
      - who: John
        says: >-
          Robyn's on 0412 555 010. Jack you've got my phone. Michael's number I never
          remember, it's in the phone under Mick.
      - who: Jack
        says: >-
          Peter the accountant handles the company books and the trust. Gail did the will. If
          it's anything about money, Peter's the first call — Dad wouldn't want us ringing the
          bank ourselves.
      - who: John
        says: >-
          Robyn and Michael have never met properly, only at the funeral. They'd clash. Jack,
          you'd have to be the one in the middle.
      - who: John
        says: >-
          Nobody's been told any of this, really. Jack knows some of it. Michael knows none of
          it.
      - who: Jack
        says: >-
          Actually — don't let anyone ring Trent about the forty grand straight away. That'd
          cause a blue at exactly the wrong moment.
      - who: John
        says: >-
          I honestly don't know who'd look after the company if I went. Peter would know what
          needs doing, I suppose.
      - who: Jack
        says: >-
          I think that's the people covered.
      - who: Jack
        says: >-
          Yes, let's stop there for today.
    first-days:
      - who: Jack
        says: >-
          Dad's not religious, so there's nothing that has to happen within a set number of
          days. The RSL would do a short service and cremation's fine. Nobody needs to rush
          that.
      - who: Jack
        says: >-
          In order, I'd say: I get the call, I ring Michael and Aunty Robyn, then Peter, then
          the funeral people. The bank comes after Peter's had a look, not before.
      - who: John
        says: >-
          The unit that's on the market — don't let the agent push anything through while all
          this is going on. Jack, you tell them to hold off until Peter says otherwise.
      - who: John
        says: >-
          And don't close the company account. A couple of builders still owe me invoices and
          they pay into it. If it gets frozen those payments just bounce.
      - who: Jack
        says: >-
          The roof claim has been dragging on since March. Somebody has to keep chasing the
          insurer or it'll go nowhere. I don't know if there's a deadline on it. The paperwork's
          in the ute, in the glovebox I think.
      - who: John
        says: >-
          The ute's on a loan. Keep paying it for a while, don't hand it back the first week —
          Jack will need it to get between the units.
      - who: Jack
        says: >-
          The first month is mostly Peter sorting the company and the trust, and Gail starting
          on the will. By six months the units either sell or get properly managed, but that's
          a later decision.
      - who: Jack
        says: >-
          I think that covers the first few weeks.
      - who: Jack
        says: >-
          Yes, let's stop there for today.
    money-out:
      - who: John
        says: >-
          The everyday account with NAB is the one everything comes out of — rates, power, the
          phone, insurance. The savings account sits next to it. Only my name's on both.
      - who: John
        says: >-
          Two term deposits, NAB as well. One rolls over around March, I think. The other one
          I'd have to look up.
      - who: Jack
        says: >-
          The shares are through CommSec. Dad said around ninety thousand last time he looked,
          and he doesn't want them sold in a hurry.
      - who: John
        says: >-
          The company account's with Westpac, with an overdraft on it. That's Peter's area, he
          does the BAS. Ring him before anyone touches it.
      - who: Jack
        says: >-
          The paperwork's in the filing cabinet in the garage. Top drawer's the trust, bottom
          drawer's the company. Most statements come by email now though.
      - who: John
        says: >-
          The power, the phone and the insurance on the house and the ute all come out
          automatically. The council rates I pay by hand every quarter, so those would just
          stop.
      - who: Jack
        says: >-
          The house insurance can't lapse — if the place is empty and it stops, that's a
          disaster. Same with the landlord insurance on the units. The trust account pays the
          strata on those, that's separate.
      - who: John
        says: >-
          There's a storage unit I pay for once a year, just tools from the business. Nobody
          knows about that one. I couldn't tell you when it's due.
      - who: Jack
        says: >-
          I think that's the money going out covered.
      - who: Jack
        says: >-
          Yes, let's stop there for today.
    money-in-owed:
      - who: John
        says: >-
          What's owed: the loan on the ute, maybe twelve thousand left. The overdraft on the
          company, usually under twenty. No mortgage, and the one credit card I pay off every
          month.
      - who: Jack
        says: >-
          Tax — Peter would know. I honestly don't know if there's anything outstanding for
          this year.
      - who: John
        says: >-
          I never went guarantor for anyone. The overdraft might have my name on it personally
          though, I'd have to ask Peter.
      - who: Jack
        says: >-
          Then there's Trent and the forty grand. Nothing's written down. He paid five thousand
          back last Christmas, so it's thirty-five owing.
      - who: John
        says: >-
          I wouldn't want Trent chased hard over it. Just written down, so it's not forgotten
          and nobody can say it never happened.
      - who: John
        says: >-
          Coming in: rent from both units, about eight hundred a week between them, into the
          trust account. And two final invoices from the builders, about fifteen thousand all
          up.
      - who: Jack
        says: >-
          If the roof claim pays out, that's money coming in too. And Dad's super — he's got a
          bloke who looks after it, but I don't know which fund it's with.
      - who: John
        says: >-
          The share dividends come in twice a year into the NAB account. Nobody would think to
          chase those.
      - who: Jack
        says: >-
          I think that's everything owed and coming in.
      - who: Jack
        says: >-
          Yes, let's stop there for today.
